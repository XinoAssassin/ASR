# Build the Docker images on GitHub and publish them to GitHub Container Registry (ghcr.io).
#
#   ghcr.io/<owner>/asr-backend:cpu      backend, local models on CPU (Dockerfile target backend-cpu)
#   ghcr.io/<owner>/asr-backend:cuda     backend on NVIDIA CUDA      (target backend-cuda)
#   ghcr.io/<owner>/asr-frontend:latest  SPA served by nginx         (target frontend)
#
# Every push to main updates those tags; a `v*` tag also publishes `<version>-cpu`, `<version>-cuda`
# and `<version>` (frontend). Each image is also tagged with the commit (`sha-<short>-…`), so a NAS
# can pin a known-good build. Pull them with deploy/ghcr/docker-compose.yml (docs/DEPLOYMENT.md §2.1).
# Images are linux/amd64 only.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-cpu
            target: backend-cpu
            image: asr-backend
            flavor: suffix=-cpu,onlatest=true
            latest: cpu
          - name: backend-cuda
            target: backend-cuda
            image: asr-backend
            flavor: suffix=-cuda,onlatest=true
            latest: cuda
          - name: frontend
            target: frontend
            image: asr-frontend
            flavor: ""
            latest: latest
    steps:
      # The CUDA image (cuDNN runtime + cu126 torch) does not fit the runner's default free space.
      - name: Free disk space
        if: matrix.target == 'backend-cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          flavor: |
            latest=false
            ${{ matrix.flavor }}
          tags: |
            type=raw,value=${{ matrix.latest }},suffix=,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Multi-speaker ASR (${{ matrix.target }})

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false

      - name: Smoke test
        if: matrix.target == 'backend-cpu'
        run: |
          ref="${{ steps.name.outputs.ref }}:sha-${GITHUB_SHA::7}-cpu"
          docker run --rm "$ref" asr --help > /dev/null
          docker run -d --name asr -e ASR_ALLOW_UNAUTHENTICATED_NETWORK=1 -p 127.0.0.1:8000:8000 "$ref"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs asr; exit 1
