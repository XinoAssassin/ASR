[project]
name = "asr"
version = "0.1.0"
description = "Self-hosted multi-speaker speech-to-text: core library, FastAPI backend and CLI"
readme = { text = "Multi-speaker ASR backend. See PLAN.md in the repository root.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "sse-starlette>=3.6",
  "python-multipart>=0.0.32",
  "aiosqlite>=0.22",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",
  "av>=19",
  "imageio-ffmpeg>=0.7",
  "numpy>=2.5",
  "typer>=0.27",
  "rich>=15.0",
  "asr-hotword>=0.1",  # [5b] L1 phoneme-level term correction (MIT; pypinyin + rapidfuzz)
]

[project.optional-dependencies]
# Torch flavours (EXECUTION_LOG D9). Exactly one may be selected; tests never import torch.
cpu = ["torch==2.14.1"]
cuda = ["torch==2.14.1"]
# AMD GPUs (ASR_DEVICE=rocm). Linux: pytorch.org's rocm7.2 wheel, which bundles the ROCm libraries.
# Windows: no ROCm wheels on pytorch.org, AMD's TheRock build instead; its newest torch is 2.14.0
# and its kernels come per GPU target (gfx1151 = Ryzen AI Max / Radeon 8060S; docs/DEPLOYMENT.md
# §8.1 for other GPUs). triton-rocm is Linux-only.
rocm = [
  "torch==2.14.1; sys_platform == 'linux'",
  "triton-rocm; sys_platform == 'linux'",
  "torch==2.14.0+rocm10.1.0; sys_platform == 'win32'",
  "amd-torch-device-gfx1151==2.14.0+rocm10.1.0; sys_platform == 'win32'",
  "rocm[libraries]; sys_platform == 'win32'",
  "rocm-sdk-core; sys_platform == 'win32'",
  "rocm-sdk-libraries; sys_platform == 'win32'",
  "rocm-sdk-device-gfx1151; sys_platform == 'win32'",
  "rocm-bootstrap; sys_platform == 'win32'",
]
# Local model stack (M4+), combined with cpu or cuda: Qwen3-ASR and Fun-ASR-Nano run on native
# transformers; SeACo-Paraformer, FSMN-VAD and CAM++ come from funasr (EXECUTION_LOG D29).
# No torchaudio: it stops at 2.11, and funasr's inference path falls back to kaldi-native-fbank.
local = [
  "transformers>=5.21",
  "accelerate>=1.12",
  "huggingface-hub>=1.31",
  "funasr>=1.4.17",
  "kaldi-native-fbank>=1.20",
  "modelscope>=1.40",
]
# M11: English-only local ASR via faster-whisper (CTranslate2), combined with `local` (VAD, CAM++).
whisper = ["faster-whisper>=1.2"]

[project.scripts]
asr = "server.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "pytest-timeout>=2.4",
  "respx>=0.23",
  "asgi-lifespan>=2.1",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asr", "server"]

# ------------------------------------------------------------------- uv
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
  { index = "amd-rocm-windows", extra = "rocm", marker = "sys_platform == 'win32'" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
amd-torch-device-gfx1151 = [{ index = "amd-rocm-windows", extra = "rocm" }]
rocm = [{ index = "amd-rocm-windows", extra = "rocm" }]
rocm-sdk-core = [{ index = "amd-rocm-windows", extra = "rocm" }]
rocm-sdk-libraries = [{ index = "amd-rocm-windows", extra = "rocm" }]
rocm-sdk-device-gfx1151 = [{ index = "amd-rocm-windows", extra = "rocm" }]
rocm-bootstrap = [{ index = "amd-rocm-windows", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
# Matches the nvidia/cuda:12.6.3 base image of the backend-cuda Docker target.
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "amd-rocm-windows"
url = "https://stable.repo.amd.com/rocm/whl-next/"
explicit = true

# AMD's Linux and Windows wheels of this version differ (only Linux requires triton), and uv reads
# one wheel's metadata for all of them: state the Windows wheel's requirements.
[[tool.uv.dependency-metadata]]
name = "torch"
version = "2.14.0+rocm10.1.0"
requires-dist = [
  "filelock",
  "typing-extensions>=4.10.0",
  "setuptools>=77.0.3",
  "sympy>=1.13.3",
  "networkx>=2.5.1",
  "jinja2",
  "fsspec>=0.8.5",
  "rocm[libraries]~=10.1.0",
  "rocm-bootstrap",
]

# ----------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "ASYNC", # blocking calls in async code
  "S",     # bandit
  "C4",    # comprehensions
  "SIM",   # simplify
  "RUF",   # ruff-specific
]
ignore = [
  "RUF001", "RUF002", "RUF003", # Chinese text legitimately contains full-width punctuation
  "S603",                       # subprocess without shell is the intended imageio-ffmpeg fallback
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
"scripts/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File",
  "fastapi.Form", "fastapi.Header", "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["asr", "server"]

# --------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
