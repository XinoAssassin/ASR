[project]
name = "asr"
version = "0.1.0"
description = "Self-hosted multi-speaker speech-to-text: core library, FastAPI backend and CLI"
readme = { text = "Multi-speaker ASR backend. See PLAN.md in the repository root.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "sse-starlette>=3.6",
  "python-multipart>=0.0.32",
  "aiosqlite>=0.22",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",
  "av>=19",
  "imageio-ffmpeg>=0.7",
  "numpy>=2.5",
  "typer>=0.27",
  "rich>=15.0",
  "asr-hotword>=0.1",  # [5b] L1 phoneme-level term correction (MIT; pypinyin + rapidfuzz)
]

[project.optional-dependencies]
# Torch flavours (EXECUTION_LOG D9). Exactly one may be selected; tests never import torch.
cpu = ["torch==2.14.1"]
cuda = ["torch==2.14.1"]
# Local model stack (M4+), combined with cpu or cuda: Qwen3-ASR and Fun-ASR-Nano run on native
# transformers; SeACo-Paraformer, FSMN-VAD and CAM++ come from funasr (EXECUTION_LOG D29).
# No torchaudio: it stops at 2.11, and funasr's inference path falls back to kaldi-native-fbank.
local = [
  "transformers>=5.21",
  "accelerate>=1.12",
  "huggingface-hub>=1.31",
  "funasr>=1.4.17",
  "kaldi-native-fbank>=1.20",
  "modelscope>=1.40",
]

[project.scripts]
asr = "server.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "pytest-timeout>=2.4",
  "respx>=0.23",
  "asgi-lifespan>=2.1",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asr", "server"]

# ------------------------------------------------------------------- uv
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
# Matches the nvidia/cuda:12.6.3 base image of the backend-cuda Docker target.
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# ----------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "ASYNC", # blocking calls in async code
  "S",     # bandit
  "C4",    # comprehensions
  "SIM",   # simplify
  "RUF",   # ruff-specific
]
ignore = [
  "RUF001", "RUF002", "RUF003", # Chinese text legitimately contains full-width punctuation
  "S603",                       # subprocess without shell is the intended imageio-ffmpeg fallback
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
"scripts/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File",
  "fastapi.Form", "fastapi.Header", "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["asr", "server"]

# --------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
