# Example: HTTPS reverse proxy in front of the backend (`asr serve` or the backend container).
#
#   browser / desktop app --HTTPS--> nginx :443 --HTTP--> asr serve 127.0.0.1:8000
#
# Run the backend on loopback and tell it to trust this proxy's X-Forwarded-* headers:
#   asr serve --host 127.0.0.1 --port 8000 --forwarded-allow-ips 127.0.0.1
# (Docker: publish the backend on 127.0.0.1:8000 and set the compose `command:` override with
#  --forwarded-allow-ips set to the docker bridge range, see docker-compose.yml.)
#
# Always set ASR_API_KEY when the proxy is reachable from the network. Auth-off mode refuses
# proxied requests (403): with --forwarded-allow-ips the peer is the real client, not loopback,
# and the Host header is the public name. Do not work around that with ASR_ALLOWED_HOSTS plus
# ASR_ALLOW_UNAUTHENTICATED_NETWORK -- it would open the API to everyone.
# ASR_CORS_ORIGINS must list the SPA's origin (e.g. https://asr-ui.example.com).
#
# Guide: docs/DEPLOYMENT.md. Replace asr-api.example.com and the certificate paths.

upstream asr_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name asr-api.example.com;
    # ACME http-01 challenges, then everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name asr-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/asr-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asr-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Uploads: the SPA and the desktop app send 8 MiB chunks; single-request uploads
    # (POST /api/uploads, e.g. curl) may be up to the backend's 2 GiB limit.
    client_max_body_size 2100m;
    # Stream request bodies to the backend instead of spooling them to disk first.
    proxy_request_buffering off;

    # Do not log the X-API-Key header (nginx never logs request headers by default; keep it so).

    location / {
        proxy_pass http://asr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Long requests: big uploads, DOCX export, local-model downloads started from Settings.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Server-sent events (job progress): no buffering, no gzip, a read timeout far above the
    # backend's 15 s ping interval.
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://asr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Audio streaming with Range requests (waveform / player) works through the default block;
    # nginx forwards Range and returns 206 from the backend unchanged.
}
