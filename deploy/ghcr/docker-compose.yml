# Run the prebuilt images from GitHub Container Registry, e.g. on a NAS (docs/DEPLOYMENT.md §2.1).
#
#   1. Copy this file and a .env next to it on the NAS:
#        NAS_HOST=192.168.1.20            # how browsers reach the NAS (IP or name)
#        ASR_API_KEY=<long random string> # required: the backend is published on the LAN
#        DASHSCOPE_API_KEY=               # optional, for the cloud provider / LLM features
#   2. docker compose pull && docker compose up -d
#   3. Download the local models once (they are never fetched implicitly):
#        docker compose run --rm backend asr models download fsmn-vad campplus qwen3-forced-aligner qwen3-asr-0.6b --mirror
#   4. Open http://<NAS_HOST>:8080, enter the API key in Settings.
#
# NVIDIA GPU on the NAS: set ASR_BACKEND_TAG=cuda and ASR_DEVICE=cuda, and uncomment `deploy:`.
# Update: docker compose pull && docker compose up -d   (pin a build with ASR_BACKEND_TAG=sha-<commit>-cpu)

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-xinoassassin}/asr-backend:${ASR_BACKEND_TAG:-cpu}
    environment:
      ASR_DATA_DIR: /data
      ASR_UPLOAD_ROOTS: /data/uploads
      ASR_MODEL_CACHE_DIR: /models
      # Published on the LAN, so a key is mandatory (D54: no-key mode only serves loopback).
      ASR_API_KEY: ${ASR_API_KEY:?set ASR_API_KEY in .env}
      ASR_CORS_ORIGINS: ${ASR_CORS_ORIGINS:-http://${NAS_HOST:?set NAS_HOST in .env}:${ASR_FRONTEND_PORT:-8080},http://tauri.localhost}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_PROVIDER_DEFAULT: ${ASR_PROVIDER_DEFAULT:-local}
      ASR_TORCH_THREADS: ${ASR_TORCH_THREADS:-}
      ASR_LOG_LEVEL: ${ASR_LOG_LEVEL:-INFO}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_ENDPOINT: ${DASHSCOPE_ENDPOINT:-https://dashscope.aliyuncs.com}
    volumes:
      # Named volumes by default. To keep the files in NAS folders instead, use host paths and give
      # them to uid 1000 (the image's user): `mkdir -p data models && sudo chown 1000:1000 data models`,
      # then e.g. `- ./data:/data` and `- ./models:/models`.
      - asr-data:/data      # asr.db + uploads: back this up
      - asr-models:/models  # model weights (re-downloadable)
    ports:
      - "${ASR_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    stop_grace_period: 40s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    image: ghcr.io/${GHCR_OWNER:-xinoassassin}/asr-frontend:${ASR_FRONTEND_TAG:-latest}
    environment:
      # Backend URL as the browser sees it.
      ASR_BACKEND_URL: ${ASR_BACKEND_URL:-http://${NAS_HOST}:${ASR_BACKEND_PORT:-8000}}
    ports:
      - "${ASR_FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  asr-data:
  asr-models:
