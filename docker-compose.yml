# Backend (CPU) + frontend (nginx). Guide: docs/DEPLOYMENT.md.
#
#   docker compose up -d --build                     # both services on one host
#   docker compose up -d --build backend             # backend host only
#   docker compose up -d --build frontend            # static host only (no dependency on backend)
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml up -d --build backend   # NVIDIA
#
# Values come from the shell or from ./.env (see .env.example). Paths inside the container are
# fixed here on purpose: ASR_DATA_DIR / ASR_UPLOAD_ROOTS / ASR_MODEL_CACHE_DIR in .env describe a
# host install and are NOT passed through.
#
# Models are never downloaded implicitly (AGENTS.md rule 6). Fetch them once into the volume:
#   docker compose run --rm backend asr models list
#   docker compose run --rm backend asr models download fsmn-vad campplus qwen3-forced-aligner qwen3-asr-0.6b --mirror

services:
  backend:
    image: asr-backend:cpu
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-cpu
    # Default command (Dockerfile): asr serve --host 0.0.0.0 --port 8000
    # Behind a reverse proxy that reaches the container from another address, trust its
    # X-Forwarded-* headers (client IPs in the access log):
    # command: ["asr", "serve", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "172.16.0.0/12"]
    environment:
      ASR_DATA_DIR: /data
      ASR_UPLOAD_ROOTS: /data/uploads
      ASR_MODEL_CACHE_DIR: /models
      # Empty ASR_API_KEY disables auth; then only loopback Host names (plus ASR_ALLOWED_HOSTS)
      # are accepted. Set a key before publishing the port beyond 127.0.0.1.
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_ALLOWED_HOSTS: ${ASR_ALLOWED_HOSTS:-}
      # Without a key the server only accepts loopback peers and `asr serve --host 0.0.0.0`
      # refuses to start. Inside the container every request arrives from the Docker bridge, so
      # compose opts in: safe ONLY while `ports:` below publishes on 127.0.0.1. With
      # ASR_BIND_ADDR=0.0.0.0 (LAN), set ASR_API_KEY (and optionally this to 0).
      ASR_ALLOW_UNAUTHENTICATED_NETWORK: ${ASR_ALLOW_UNAUTHENTICATED_NETWORK:-1}
      # Every browser origin that serves the SPA (scheme://host[:port], no path, no '*').
      # Add http://tauri.localhost for the Windows desktop app.
      ASR_CORS_ORIGINS: ${ASR_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_PROVIDER_DEFAULT: ${ASR_PROVIDER_DEFAULT:-cloud}
      ASR_DECODER: ${ASR_DECODER:-pyav}
      ASR_TORCH_THREADS: ${ASR_TORCH_THREADS:-}
      ASR_LOCAL_DTYPE: ${ASR_LOCAL_DTYPE:-}
      ASR_LOG_LEVEL: ${ASR_LOG_LEVEL:-INFO}
      ASR_LOG_FORMAT: ${ASR_LOG_FORMAT:-text}
      # Optional path inside the container, e.g. /data/logs/asr.log (stdout is always logged).
      ASR_LOG_FILE: ${ASR_LOG_FILE:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_ENDPOINT: ${DASHSCOPE_ENDPOINT:-https://dashscope.aliyuncs.com}
      ASR_CLOUD_MODEL: ${ASR_CLOUD_MODEL:-qwen-audio-3.1-asr-flash-filetrans}
      ASR_CLOUD_FILE_TRANSFER: ${ASR_CLOUD_FILE_TRANSFER:-temp_upload}
      ASR_LLM_MODEL: ${ASR_LLM_MODEL:-qwen-plus}
    volumes:
      - asr-data:/data      # asr.db + uploads: back this up
      - asr-models:/models  # model weights (re-downloadable)
    ports:
      # Loopback by default; set ASR_BIND_ADDR=0.0.0.0 (with ASR_API_KEY) for LAN access.
      # ASR_ALLOW_UNAUTHENTICATED_NETWORK above relies on this loopback-only publish.
      - "${ASR_BIND_ADDR:-127.0.0.1}:${ASR_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    # asr serve drains for up to 30 s. A job still running at shutdown is marked failed
    # ("interrupted") on the next start and can be retried; queued jobs resume.
    stop_grace_period: 40s

  frontend:
    image: asr-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    environment:
      # Backend base URL as the *browser* sees it, written to /config.js at container start
      # (deploy/frontend-entrypoint.sh). Empty = same origin as the SPA (reverse proxy).
      ASR_BACKEND_URL: ${ASR_BACKEND_URL:-http://localhost:8000}
    ports:
      - "${ASR_BIND_ADDR:-127.0.0.1}:${ASR_FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
    # No depends_on: the SPA is static and the backend may run on another machine.

volumes:
  asr-data:
  asr-models:
