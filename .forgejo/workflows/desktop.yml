# Desktop recorder (desktop/src-tauri): fmt / clippy / tests on Linux (library only, no
# WebKitGTK) and an MSVC build of the full Tauri app on Windows (ARCH_REVIEW §4-g: the dev
# machine builds with the GNU toolchain only, so MSVC-only breakage would go unnoticed).
#
# Forgejo Actions. Runner labels are the conventional ones (`ubuntu-latest`, `windows-latest`);
# map them to your runners (the Windows runner must be a host / VM runner with the MSVC build
# tools; Docker runners cannot build for Windows). The steps do not depend on marketplace
# actions other than checkout, so they also run unchanged under GitHub Actions.
name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".forgejo/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".forgejo/workflows/desktop.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: System packages (OpenSSL for reqwest native-tls, Python for the sidecar tests)
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev python3 curl ca-certificates
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable
          rustc --version
      - name: fmt
        run: cargo fmt --check
      - name: clippy (library, no Tauri shell)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: test
        run: cargo test --no-default-features

  windows-msvc:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (MSVC)
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-host x86_64-pc-windows-msvc
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal -c rustfmt,clippy
          rustup default stable-x86_64-pc-windows-msvc
          rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Node + pnpm (the release build embeds frontend/dist)
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
            Write-Error "Node.js >= 22.12 is required on the runner"; exit 1
          }
          npm install -g corepack@latest
          corepack enable
          node --version
      - name: Build the SPA
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: clippy (app + library, MSVC)
        working-directory: desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The lib test exe *with* the `app` feature cannot start (it links Tauri but gets no
      # common-controls manifest), so tests run without it, as on the dev machine.
      - name: test (library, MSVC)
        working-directory: desktop/src-tauri
        run: |
          cargo test --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: release build (embedded SPA)
        working-directory: desktop/src-tauri
        run: |
          cargo build --release --features tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: self-test binary builds
        working-directory: desktop/src-tauri
        run: |
          cargo build --no-default-features --features selftest --bin recorder-selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
